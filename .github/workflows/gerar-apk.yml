name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    # Versão fixa do Ubuntu: a "ubuntu-latest" está migrando para o Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Confere se tudo foi enviado antes de gastar tempo compilando.
      - name: Verificar arquivos do projeto
        run: |
          falta=0
          for f in package.json package-lock.json capacitor.config.json \
                   www/index.html www/fonts/fonts.css \
                   android/gradlew android/build.gradle android/settings.gradle android/variables.gradle \
                   android/capacitor.settings.gradle android/app/build.gradle android/app/capacitor.build.gradle \
                   android/app/kagami-debug.keystore android/app/src/main/AndroidManifest.xml \
                   android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$f" ]; then echo "::error::Falta no repositório: $f"; falta=1; fi
          done
          n=$(ls www/fonts/*.woff2 2>/dev/null | wc -l)
          if [ "$n" -lt 9 ]; then echo "::error::A pasta www/fonts deveria ter 9 arquivos .woff2 e tem $n"; falta=1; fi
          exit $falta

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Garante o SDK do Android, mesmo que a imagem do GitHub mude.
      # Lista os pacotes explicitamente: o padrão da ação inclui o pacote
      # antigo "tools", que não existe mais e faz a etapa falhar.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o jogo para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KagamiGeoul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KagamiGeoul-apk
          path: KagamiGeoul.apk
