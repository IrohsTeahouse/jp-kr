name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    # Versão fixa do Ubuntu: a "ubuntu-latest" está migrando para o Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Garante o SDK do Android, mesmo que a imagem do GitHub mude.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Copiar o jogo para o Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KagamiGeoul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KagamiGeoul-apk
          path: KagamiGeoul.apk
