<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f10">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kagami Geoul</title>
<style>
/* Layout: app de coluna única, como um tomo aberto. HUD fixo no topo da cena, cena no meio, gavetas (grimório, ajustes) por cima. Visual escuro fixo. */
:root{
  color-scheme:dark;
  --bg:#0d0f10; --surface:#15191a; --surface-2:#1c2122; --line:#2b3233;
  --fg:#d9d2c3; --muted:#8f8c82; --bone:#efe6d2;
  --ok:#8fae78; --err:#c76a60; --blood:#9b3b33;
  --jp:#c98a5c; --kr:#6fa8a0;
  --accent:#b9a27a; --accent-soft:rgba(185,162,122,.12);
  --f-display:"IM Fell English SC","Times New Roman",serif;
  --f-body:"Spectral",Georgia,serif;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-kr:"Nanum Myeongjo","AppleMyungjo","Noto Serif KR","Batang",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
body[data-lang="jp"]{--accent:var(--jp);--accent-soft:rgba(201,138,92,.13)}
body[data-lang="kr"]{--accent:var(--kr);--accent-soft:rgba(111,168,160,.13)}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;
  background-image:radial-gradient(ellipse 90% 45% at 50% -10%,var(--accent-soft),transparent 70%);background-attachment:fixed;min-height:100%}
.wrap{max-width:660px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;color:var(--bone);margin:0;text-wrap:balance}
p{margin:0}
em{color:var(--bone);font-style:italic}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.jp-t{font-family:var(--f-jp)} .kr-t{font-family:var(--f-kr)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes rise{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Botões */
.btn{background:var(--accent);color:#121212;padding:12px 20px;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;justify-self:start}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4}
.ghost{border:1px solid var(--line);padding:9px 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Tela de título */
.title{display:grid;gap:22px;padding-top:6px}
.brand{display:grid;gap:6px;border-bottom:1px solid var(--line);padding-bottom:18px}
.brand .mark{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand .mark .k1{font-family:var(--f-jp);font-size:clamp(44px,12vw,68px);color:var(--jp);line-height:1}
.brand .mark .k2{font-family:var(--f-kr);font-size:clamp(40px,11vw,62px);color:var(--kr);line-height:1}
.brand .mark .dot{color:var(--muted);font-size:28px}
.brand h1{font-size:clamp(30px,7vw,40px);line-height:1.05}
.brand p{color:var(--muted);font-style:italic;max-width:52ch}
.worlds{display:grid;gap:14px}
.world{background:var(--surface);border:1px solid var(--line);padding:20px;display:grid;gap:10px;position:relative;overflow:hidden}
.world .gl{position:absolute;right:-4px;top:-14px;font-size:110px;line-height:1;opacity:.12;pointer-events:none}
.world h2{font-size:26px}
.world p{font-size:15.5px;max-width:48ch}
.world .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.world.jp h2,.world.jp .gl{color:var(--jp)} .world.kr h2,.world.kr .gl{color:var(--kr)}
.world.jp .btn{background:var(--jp)} .world.kr .btn{background:var(--kr)}
.confirm{display:grid;gap:8px;border:1px solid var(--err);padding:12px;font-size:15px}
.foot{font-size:13.5px;color:var(--muted);max-width:60ch}

/* HUD */
.hud{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;gap:10px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hud-top .where{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.meter{display:grid;gap:5px;min-width:0}
.meter .top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.meter .v{font-family:var(--f-mono);font-size:12.5px;color:var(--bone);font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--surface-2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .5s}
.bar.flu i{background:var(--accent)}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:5px;background:var(--surface-2)}
.pips i.on{background:#7a4ea0}
.inv{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border:1px solid var(--line);color:var(--fg)}
.chip.ally{border-color:var(--accent);color:var(--accent)}
.chip.ward{border-color:#b39a4f;color:#d7bf72}
@media (max-width:440px){.meters{grid-template-columns:1fr 1fr}.meters .meter:last-child{grid-column:1/-1}}

/* Cena */
.scene{background:var(--surface);border:1px solid var(--line);padding:clamp(18px,4vw,30px);display:grid;gap:18px;animation:rise .35s ease}
.scene.err{border-style:dashed;border-color:rgba(199,106,96,.5)}
.scene h2{font-size:clamp(24px,5.5vw,30px)}
.scene .head{display:grid;gap:4px}
.text{display:grid;gap:12px;max-width:62ch}
.show{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.glyph{background:var(--bg);border:1px solid var(--line);padding:12px;display:grid;gap:4px;align-content:start;text-align:left}
.glyph:hover{border-color:var(--accent)}
.glyph .g{font-size:40px;line-height:1.15;color:var(--bone)}
.glyph .r{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.glyph .m{font-size:13.5px;color:var(--muted);line-height:1.4}
.voice{border-left:2px solid var(--accent);padding:2px 0 2px 16px;display:grid;gap:2px}
.voice .who{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);letter-spacing:.08em}
.voice .line{font-size:clamp(28px,7vw,38px);color:var(--bone);line-height:1.3}
.voice .ro{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.listen{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--accent);padding:10px 16px;color:var(--bone);font-family:var(--f-mono);font-size:13px}
.play svg{width:18px;height:18px;fill:var(--accent)}
.play.sm{padding:5px 9px;font-size:11px;border-color:var(--line)}
.play.sm svg{width:14px;height:14px}
.reveal{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-decoration:underline}
.ask{font-style:italic;color:var(--bone)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface-2);border:1px solid var(--line);padding:13px 16px;text-align:left;display:flex;gap:14px;align-items:baseline;transition:border-color .2s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opt .t{font-size:26px;color:var(--bone);line-height:1.25}
.opt.plain .t{font-family:var(--f-body);font-size:17px}
.opt:disabled{opacity:.45}
.opt.right{opacity:1;border-color:var(--ok);background:rgba(143,174,120,.1)}
.opt.wrong{opacity:1;border-color:var(--err);background:rgba(199,106,96,.12)}
.opt.pick{opacity:1;border-color:var(--accent)}

/* Montar */
.slots{display:flex;gap:8px;flex-wrap:wrap;min-height:64px}
.slot{width:56px;height:60px;border:1px dashed var(--line);display:grid;place-items:center;font-size:30px;color:var(--bone);background:var(--bg)}
.slot.f{border-style:solid;border-color:var(--accent)}
.slot.okk{border-color:var(--ok)} .slot.bad{border-color:var(--err)}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:56px;height:60px;border:1px solid var(--line);background:var(--surface-2);font-size:30px;color:var(--bone);display:grid;place-items:center}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile:disabled{opacity:.2}

/* Traçar */
.trace{position:relative;width:100%;max-width:320px;aspect-ratio:1/1;border:1px solid var(--line);background:var(--bg);touch-action:none}
.trace .model{position:absolute;inset:0;display:grid;place-items:center;font-size:min(62vw,230px);color:var(--bone);opacity:.14;pointer-events:none;line-height:1}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.selfeval{display:grid;gap:8px}

/* Resultado */
.out{display:grid;gap:12px;animation:rise .4s ease}
.fate{padding:13px 15px;border:1px solid var(--line)}
.fate b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;margin-bottom:4px;font-weight:500}
.fate.good{border-color:rgba(143,174,120,.55)} .fate.good b{color:var(--ok)}
.fate.bad{border-color:rgba(199,106,96,.6)} .fate.bad b{color:var(--err)}
.fate.neutral b{color:var(--accent)}
.note{font-size:14.5px;padding:10px 13px;border-left:2px solid #b39a4f;color:var(--fg)}
.note.doom{border-left-color:var(--err)}
.lesson{background:var(--bg);border:1px dashed var(--line);padding:13px 15px;display:grid;gap:6px}
.lesson .lg{font-size:24px;color:var(--bone)}
.lesson .lr{font-family:var(--f-mono);font-size:12.5px;color:var(--accent)}
.lesson p{font-size:15px}

/* Purificação e revisão */
.track{display:flex;gap:6px;flex-wrap:wrap}
.track i{width:18px;height:26px;border:1px solid var(--line);background:var(--bg);position:relative}
.track i.lit{border-color:#d7bf72;background:linear-gradient(#d7bf72,rgba(215,191,114,.15) 40%,var(--bg))}
.track i.out{opacity:.35}
.track i.win{border-color:var(--accent);background:var(--accent-soft)}
.track i.lose{border-color:var(--err)}

/* Fim */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);padding:10px 12px;display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:20px;color:var(--bone);font-weight:500;font-variant-numeric:tabular-nums}
.locked{border:1px dashed var(--line);padding:14px;display:grid;gap:6px;color:var(--muted)}
.locked h3{font-size:19px;color:var(--fg)}

/* Gavetas */
.drawer{position:fixed;inset:0;background:rgba(5,6,7,.78);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--surface);border:1px solid var(--line);width:100%;max-width:620px;padding:20px;display:grid;gap:16px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel h2{font-size:26px}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.gitem{border:1px solid var(--line);padding:10px;display:grid;gap:2px;text-align:left;background:var(--bg)}
.gitem .g{font-size:28px;color:var(--bone);line-height:1.2}
.gitem .r{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.gitem .m{font-size:13px;color:var(--muted)}
.gitem .sc{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic}
.set{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.set:first-of-type{border-top:0;padding-top:0}
textarea{width:100%;min-height:90px;background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:10px;font-family:var(--f-mono);font-size:12px;resize:vertical;box-sizing:border-box}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:8px 10px;font:inherit;font-size:15px}
.msg{font-size:14px;color:var(--accent);min-height:1em}
.toggle{display:flex;gap:10px;align-items:center}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
</style>

</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<div class="drawer" id="drawer" hidden></div>

<script>
const STORY = {};
// Capítulo I · O Selo de Kagami (japonês)
STORY.jp = {
  name: `O Selo de Kagami`, lang: `Japonês`, tts: `ja-JP`, cls: `jp-t`, glyph: `鏡`,
  mac: `穢れ`, macName: `kegare`, ward: `omamori`,
  pitch: `Quando o espelho sagrado se partiu, levou sua voz. Reaprenda a falar antes que os mortos de Yomi aprendam o seu nome.`,
  ch1: `A primeira voz`,
  tiers: [
    [`Lua limpa`, `Sua garganta está limpa e o kegare quase sumiu. Os espíritos já sussurram sobre o viajante que devolveu a voz de uma vila.`],
    [`Névoa de Yomi`, `Você venceu, mas a névoa de Yomi ainda gruda na sua sombra. No Capítulo II, alguns espíritos vão sentir esse cheiro.`],
    [`À beira do poço`, `Você chegou ao fim com o kegare no limite. A próxima jornada começa à beira do poço: mais um tropeço, e Yomi chama você de volta.`]
  ],
  next: `Capítulo II · A estrada da capital: as linhas S, T e N do hiragana, a primeira leitura de は e を, e uma raposa que cobra dívidas.`,
  review: {
    name: `Hyakumonogatari`, unit: `velas`,
    intro: `Os aldeões de Kuchinashi celebram a voz recuperada como manda a tradição do período Edo: com o Hyakumonogatari, a noite das cem histórias de fantasmas. Cada história contada apaga uma vela. Hoje, cada resposta certa é uma história. Dizem que, quando a última vela se apaga, aparece a Aoandon, a mulher de pele azul e chifres, vestida de branco.`,
    win: `A última vela se apaga. Na escuridão, a Aoandon aparece, com a pele azul brilhando como a chama de uma lanterna. Ela sorri com os dentes pintados de preto e deixa uma lanterna azul aos seus pés. No Capítulo II, ela revela uma resposta uma vez.`,
    lose: `Algumas velas continuam acesas. A Aoandon aparece mesmo assim, irritada por ter sido chamada antes da hora, e anota num papel o que você esqueceu. Essas palavras vão assombrar você no começo do Capítulo II.`,
    reward: `lanterna`
  },
  items: {
    omamori: `Omamori (absorve 1 erro)`, kyuri: `Pepino do kappa`, folha: `Folha do tanuki`, kaki: `Caqui da zashiki-warashi`,
    prato: `O décimo prato de Okiku`, caco1: `Caco do espelho · 1 de 8`, lanterna: `Lanterna Azul da Aoandon`
  },
  allies: { kodama: `Kodama`, chochin: `Chōchin (guia)`, chochin_r: `Chōchin (rabugento)`, kappa: `Kappa honrado`, oni_ao: `Oni azul desertor` },
  lex: {
    a: {g:`あ`, r:`a`, t:`s`}, i: {g:`い`, r:`i`, t:`s`}, u: {g:`う`, r:`u`, t:`s`}, e: {g:`え`, r:`e`, t:`s`}, o: {g:`お`, r:`o`, t:`s`},
    ka: {g:`か`, r:`ka`, t:`s`}, ki: {g:`き`, r:`ki`, t:`s`}, ku: {g:`く`, r:`ku`, t:`s`}, ke: {g:`け`, r:`ke`, t:`s`}, ko: {g:`こ`, r:`ko`, t:`s`},
    w_kaki: {g:`かき`, r:`kaki`, m:`caqui`, t:`m`}, w_kiku: {g:`きく`, r:`kiku`, m:`ouvir · crisântemo`, t:`m`},
    w_ie: {g:`いえ`, r:`ie`, m:`casa`, t:`m`}, w_ike: {g:`いけ`, r:`ike`, m:`lagoa`, t:`m`},
    w_kao: {g:`かお`, r:`kao`, m:`rosto`, t:`m`}, w_koe: {g:`こえ`, r:`koe`, m:`voz`, t:`m`}
  },
  nodes: {
    P0: {type:`story`, st:1, cp:true, title:`Prólogo · Silêncio`,
      text:`<p>Madeira úmida contra o rosto. Cheiro de incenso apagado. Você abre os olhos num santuário em ruínas, no alto de uma montanha que não lembra de ter subido.</p><p>No altar, o espelho sagrado <em>Yata no Kagami</em> está partido em oito pedaços. Você tenta chamar alguém, mas nenhum som sai. Quando o espelho quebrou, levou junto o seu <em>kotodama</em>, a alma das palavras. Sem ele, os vivos não ouvem você. Os mortos, sim.</p><p>Os sinos do santuário balançam sem vento. Uma brisa fria passa pela sua garganta, carregando um único som.</p>`,
      next:`P0q`},
    P0q: {type:`quiz`, st:1, title:`O primeiro som`, hear:`あ`, hr:`a`, plain:true,
      ask:`Ouça a brisa. Que som ela carrega?`,
      opts:[{t:`a`, ok:1}, {t:`o`}, {t:`u`}],
      okText:`Sua garganta solta um "a" rouco, o primeiro som em muito tempo. No altar, uma chama azul acende sozinha.`,
      failText:`O som escapa antes que você o agarre. As árvores ao redor repetem o que você disse, em vozes que não são humanas.`,
      lesson:{g:`あ`, r:`a`, m:`O primeiro som do japonês. Por enquanto, basta reconhecer o "a" aberto, como em "casa". A letra vem na próxima cena.`},
      next:`N1`, fail:`P0b`},
    P0b: {type:`story`, err:true, title:`O Eco dos Kodama`,
      text:`<p>Você tropeça para fora do santuário, entre cedros tão velhos que as raízes parecem muralhas. Nos galhos, pequenas figuras brancas com três furos no rosto, como máscaras de argila, viram a cabeça ao mesmo tempo.</p><p>São <em>kodama</em>, os espíritos que moram nas árvores antigas. Quando alguém grita na montanha e a voz volta, dizem que é um kodama respondendo. Eles não estão bravos. Estão curiosos. E querem ensinar.</p>`,
      fx:{ally:`kodama`}, next:`P0b2`},
    P0b2: {type:`speak`, title:`Repita com os kodama`,
      text:`<p>Os kodama dizem cada som devagar, e o eco volta das montanhas. Ouça, repita em voz alta e diga com sinceridade como saiu. Aqui não há como errar.</p>`,
      lines:[{g:`あ`, r:`a`}, {g:`い`, r:`i`}, {g:`う`, r:`u`}],
      after:`Um kodama pequeno decide ir com você, escondido no seu bolso. Ele vai lembrar desta noite.`,
      next:`N1`},
    N1: {type:`story`, st:2, title:`A miko de cinzas`,
      text:`<p>De volta ao altar, alguém espera por você: uma jovem de túnica branca e saia vermelha, as vestes de uma <em>miko</em>, sacerdotisa do santuário. Os pés dela não tocam o chão.</p><p>Ela mergulha o dedo na cinza do incenso e desenha uma letra no assoalho. Depois aponta para a própria boca e abre bem os lábios: "a".</p>`,
      show:[{g:`あ`, r:`a`, m:`Três traços: um horizontal, um vertical que se curva, e um laço que cruza os dois.`}],
      learn:[`a`], next:`N1q`},
    N1q: {type:`quiz`, st:2, title:`Três letras na cinza`,
      ask:`A miko apaga a cinza e desenha três letras parecidas. Qual é あ?`,
      opts:[{t:`あ`, ok:1}, {t:`お`}, {t:`ぬ`}], learn:[`a`],
      okText:`A miko sorri. A lanterna de papel pendurada no altar abre um olho único e mostra a língua: é uma chōchin-obake, uma lanterna que ganhou alma depois de cem anos. Ela se oferece para guiar você.`,
      okFx:{ally:`chochin`},
      failText:`Você aponta a letra errada. A lanterna velha do altar gargalha, abre um olho e uma boca enorme: uma chōchin-obake zombeteira.`,
      lesson:{g:`あ・お`, r:`a · o`, m:`あ e お se parecem. お tem um pontinho solto no alto, à direita. あ não tem.`},
      next:`N1t`, fail:`N1b`},
    N1b: {type:`quiz`, err:true, title:`A lanterna que zomba`,
      text:`<p>A chōchin-obake pula do gancho e quica pelo santuário, rindo. Dizem que objetos esquecidos por cem anos viram <em>tsukumogami</em> e se vingam de quem os maltratou. Ela promete ficar quieta se você provar que entende a letra.</p>`,

<script>
// ===== Kagami Geoul · motor do piloto =====
const KEY = 'kagami-geoul-save';
const SAVE_V = 1;
const MAX_MAC = 5;
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>';
const $ = s => document.querySelector(s);
const app = $('#app'), drawer = $('#drawer');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- Salvamento ----------
let memSave = null;
function blankSave(){ return {v:SAVE_V, set:{roma:true, rate:0.85}, p:{jp:null, kr:null}}; }
function loadSave(){
  try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && o.v === SAVE_V && o.p) return o; } } catch(e) {}
  return memSave || blankSave();
}
function persist(){ memSave = SAVE; try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch(e) {} }
let SAVE = loadSave();
let cur = null, P = null;
const W = () => STORY[cur];

function newProfile(lang){
  return {lang, ch:1, node:'P0', hp:100, mac:0, streak:0, flu:0, items:[], allies:[], flags:{},
    learned:{}, voice:[], visited:[], cp:null, endings:[], done:[], review:null, weak:[], started:Date.now()};
}
function snapshot(){ const c = JSON.parse(JSON.stringify(P)); delete c.cp; return c; }

// ---------- Voz ----------
let voices = [];
function loadVoices(){ try { voices = speechSynthesis.getVoices() || []; } catch(e) { voices = []; } }
if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.onvoiceschanged = loadVoices; } catch(e) {} }
// No app instalado (Android), a voz usa o motor nativo do aparelho pelo plugin TextToSpeech.
// No navegador, usa a Web Speech API.
const CAP = window.Capacitor;
const IS_NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const NTTS = IS_NATIVE ? ((CAP.Plugins && CAP.Plugins.TextToSpeech) || (CAP.registerPlugin && CAP.registerPlugin('TextToSpeech'))) : null;
const LANG_TTS = {jp:'ja-JP', kr:'ko-KR'};
function voiceFor(code){ const c = (code || W().tts).slice(0,2).toLowerCase(); return voices.find(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(c)); }
function sayIn(t, lang){
  if (!t) return;
  if (NTTS) { try { NTTS.stop().catch(() => {}); NTTS.speak({text:t, lang, rate:SAVE.set.rate, pitch:1, volume:1, category:'playback'}).catch(() => {}); } catch(e) {} return; }
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = lang; u.rate = SAVE.set.rate;
    const v = voiceFor(lang); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e) {}
}
function say(t){ sayIn(t, W().tts); }
async function hasVoice(lang){
  if (NTTS) { try { const r = await NTTS.isLanguageSupported({lang}); return !!(r && r.supported); } catch(e) { return false; } }
  if (!('speechSynthesis' in window)) return false;
  loadVoices(); return !!voiceFor(lang);
}
const playBtn = (t, label, sm) => `<button class="play${sm?' sm':''}" data-say="${esc(t)}">${ICON}<span>${label||'Ouvir'}</span></button>`;
function wirePlay(root){ root.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); say(b.dataset.say); }); }

// ---------- Efeitos e estado ----------
function fx(f){
  if (!f) return;
  if (f.hp) P.hp = Math.max(0, Math.min(100, P.hp + f.hp));
  if (f.mac) P.mac = Math.max(0, P.mac + f.mac);
  if (f.flu) P.flu = Math.min(100, P.flu + f.flu);
  if (f.item && !P.items.includes(f.item)) P.items.push(f.item);
  if (f.ally && !P.allies.includes(f.ally)) P.allies.push(f.ally);
  if (f.lose) P.items = P.items.filter(i => i !== f.lose);
  if (f.flag) P.flags[f.flag] = true;
}
function learn(k, ok){
  if (!W().lex[k]) return;
  const e = P.learned[k] || (P.learned[k] = {r:0, w:0, s:null});
  if (ok === true) e.r++; else if (ok === false) e.w++;
}
function faintCheck(){ if (P.hp <= 0) { P.hp = 35; return true; } return false; }

// ---------- Navegação ----------
function goto(id){
  const L = W();
  let n = L.nodes[id];
  if (!n) { id = 'END'; n = L.nodes.END; }
  P.node = id;
  if (n.type === 'gate') { return goto(P.items.includes(n.go) ? n.yes : n.no); }
  if (!P.visited.includes(id)) {
    P.visited.push(id);
    fx(n.fx);
    if (n.type === 'story' && n.learn) n.learn.forEach(k => learn(k, null));
  }
  if (n.cp) P.cp = snapshot();
  P._faint = faintCheck() || P._faint;
  persist();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function open(lang, fresh){
  cur = lang;
  if (fresh || !SAVE.p[lang]) SAVE.p[lang] = newProfile(lang);
  P = SAVE.p[lang];
  document.body.dataset.lang = lang;
  persist();
  if (P.visited.length === 0) goto(P.node); else render();
}

// ---------- Peças de interface ----------
function hud(){
  const L = W(), n = L.nodes[P.node] || {};
  const st = n.st || (P.node === 'END' ? 12 : '·');
  const chips = [
    ...P.items.map(i => `<span class="chip${i === L.ward ? ' ward' : ''}">${esc(L.items[i] || i)}</span>`),
    ...P.allies.map(a => `<span class="chip ally">${esc(L.allies[a] || a)}</span>`)
  ].join('');
  return `<header class="hud">
    <div class="hud-top">
      <button class="ghost" data-act="menu">Menu</button>
      <span class="where">Cap. I · ${esc(L.ch1)} · etapa ${st}/12</span>
      <button class="ghost" data-act="grim">Grimório</button>
    </div>
    <div class="meters">
      <div class="meter"><div class="top"><span class="label">Vida</span><span class="v">${P.hp}</span></div><div class="bar"><i style="width:${P.hp}%"></i></div></div>
      <div class="meter"><div class="top"><span class="label">Mácula <span class="${L.cls}">${L.mac}</span></span><span class="v">${Math.min(P.mac, MAX_MAC)}/${MAX_MAC}</span></div>
        <div class="pips">${Array.from({length:MAX_MAC}, (_, i) => `<i class="${i < P.mac ? 'on' : ''}"></i>`).join('')}</div></div>
      <div class="meter"><div class="top"><span class="label">Fluência</span><span class="v">${P.flu}%</span></div><div class="bar flu"><i style="width:${P.flu}%"></i></div></div>
    </div>
    ${chips ? `<div class="inv">${chips}</div>` : ''}
  </header>`;
}
function wireHud(){
  app.querySelectorAll('[data-act="menu"]').forEach(b => b.onclick = () => title());
  app.querySelectorAll('[data-act="grim"]').forEach(b => b.onclick = () => grimoire());
}
function head(n){
  const tag = n.err ? 'Rota alternativa' : (n.type === 'purify' ? 'Purificação' : 'Capítulo I');
  return `<div class="head"><span class="label">${tag}</span><h2>${esc(n.title || '')}</h2></div>`;
}
function showCards(arr){
  if (!arr) return '';
  const c = W().cls;
  return `<div class="show">${arr.map(s => `<button class="glyph" data-say="${esc(s.say || s.g)}"><span class="g ${c}">${esc(s.g)}</span><span class="r">${esc(s.r)}</span>${s.m ? `<span class="m">${esc(s.m)}</span>` : ''}</button>`).join('')}</div>`;
}
function voiceLine(n){
  if (!n.line) return '';
  const ro = n.roma && SAVE.set.roma ? `<span class="ro">${esc(n.roma)}</span>` : '';
  return `<div class="voice">${n.speaker ? `<span class="who">${esc(n.speaker)}</span>` : ''}<span class="line ${W().cls}">${esc(n.line)}</span>${ro}</div>`;
}
function listenBlock(n){
  if (!n.hear) return '';
  return `<div class="listen">${playBtn(n.hear, 'Ouvir')}${n.hr ? `<button class="reveal" data-reveal="${esc(n.hr)}">Não consigo ouvir</button>` : ''}</div>`;
}
function wireReveal(root){
  root.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => { b.outerHTML = `<span class="label">O som é: ${esc(b.dataset.reveal)}</span>`; });
}
function lessonBox(l){
  if (!l) return '';
  return `<div class="lesson"><span class="label">Fragmento do grimório</span><span class="lg ${W().cls}">${esc(l.g)}</span>${l.r ? `<span class="lr">${esc(l.r)}</span>` : ''}<p>${esc(l.m)}</p></div>`;
}

// ---------- Render principal ----------
function render(){
  const n = W().nodes[P.node];
  if (n.type === 'end') return renderEnd();
  if (n.type === 'bad') return renderBad(n);
  let body = '';
  if (n.type === 'story') body = renderStory(n);
  else if (n.type === 'quiz') body = renderQuiz(n);
  else if (n.type === 'choice') body = renderChoice(n);
  else if (n.type === 'build') body = renderBuild(n);
  else if (n.type === 'trace') body = renderTrace(n);
  else if (n.type === 'speak') body = renderSpeak(n);
  else if (n.type === 'purify') body = renderPurify(n);
  app.innerHTML = hud() + `<article class="scene${n.err ? ' err' : ''}">${head(n)}${body}<div id="out"></div></article>`;
  wireHud(); wirePlay(app); wireReveal(app);
  const w = wiring[n.type]; if (w) w(n);
  if (P._faint) {
    P._faint = false; persist();
    const o = $('#out'); if (o && !o.innerHTML) o.insertAdjacentHTML('beforebegin', `<p class="note doom">Você desmaiou e acordou mais adiante, com o corpo moído. A vida voltou para 35.</p>`);
  }
  if (n.hear && (n.type === 'quiz' || n.type === 'build')) setTimeout(() => say(n.hear), 350);
}
const wiring = {};

function renderStory(n){
  return `<div class="text">${n.text || ''}</div>${showCards(n.show)}${voiceLine(n)}<button class="btn" id="go">Continuar</button>`;
}
wiring.story = n => { $('#go').onclick = () => goto(n.next); };

function optHTML(n, o, i){
  const glyph = !n.plain;
  return `<button class="opt${glyph ? '' : ' plain'}" data-i="${i}"><span class="k">${String.fromCharCode(65 + i)}</span><span class="t ${glyph ? W().cls : ''}">${esc(o.t)}</span></button>`;
}
function renderQuiz(n){
  const opts = n.fixed ? n.opts.map((o, i) => [o, i]) : shuffle(n.opts.map((o, i) => [o, i]));
  return `${n.text ? `<div class="text">${n.text}</div>` : ''}${voiceLine(n)}${listenBlock(n)}
    <p class="ask">${esc(n.ask)}</p>
    <div class="opts">${opts.map(([o, i]) => optHTML(n, o, i)).join('')}</div>`;
}
wiring.quiz = n => {
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = n.opts[+b.dataset.i];
    if (o.say) say(o.say);
    app.querySelectorAll('.opt').forEach(x => {
      x.disabled = true;
      const ox = n.opts[+x.dataset.i];
      if (ox.ok && !o.go) x.classList.add('right');
    });
    const ok = !!o.ok;
    if (o.go && ok) b.classList.add('pick'); else if (ok) b.classList.add('right'); else b.classList.add('wrong');
    if (!ok && o.go) app.querySelectorAll('.opt').forEach(x => { if (n.opts[+x.dataset.i].ok) x.classList.add('right'); });
    resolve(n, ok, o);
  });
};

function resolve(n, ok, opt){
  let ward = false, cleanse = false;
  if (ok) {
    P.streak = 0;
    P.run = (P.run || 0) + 1;
    if (P.run >= 3 && P.mac > 0) { P.mac--; P.run = 0; cleanse = true; }
    P.flu = Math.min(100, P.flu + (n.flu ?? 6));
    fx(n.okFx);
  } else {
    const w = W().ward;
    P.run = 0;
    if (P.items.includes(w)) { P.items = P.items.filter(i => i !== w); ward = true; }
    else { P.streak++; P.mac += P.streak; P.hp = Math.max(0, P.hp - (n.dmg ?? 15)); }
    fx(n.failFx);
  }
  if (opt && opt.fx) fx(opt.fx);
  (n.learn || []).forEach(k => learn(k, ok));
  let next = (opt && opt.go) || (ok ? n.next : n.fail) || n.next;
  let doom = false;
  if (!ok && !ward && (P.mac >= MAX_MAC || P.streak >= 3)) { next = 'BAD'; doom = true; }
  const faint = faintCheck();
  P.node = next;
  persist();
  const L = W();
  const text = ok ? ((opt && opt.res) || n.okText) : n.failText;
  const isChoice = opt && opt.go && ok;
  app.querySelector('.hud').outerHTML = hud(); wireHud();
  const out = $('#out');
  out.innerHTML = `<div class="out">
    <p class="fate ${isChoice ? 'neutral' : ok ? 'good' : 'bad'}"><b>${isChoice ? 'VOCÊ ESCOLHEU' : ok ? 'A PALAVRA PROTEGE VOCÊ' : 'A PALAVRA FERE VOCÊ'}</b>${esc(text || '')}</p>
    ${cleanse ? `<p class="note">Três acertos seguidos: a palavra certa purifica. A mácula recua um ponto.</p>` : ''}
    ${ward ? `<p class="note">O ${esc(L.items[L.ward].split(' (')[0])} se desfaz e absorve o erro: sem mácula, sem dano. A história, porém, segue pelo caminho do erro.</p>` : ''}
    ${!ok && !ward && !doom && P.streak === 2 ? `<p class="note doom">Dois erros seguidos. Mais um e a mácula leva você para o abismo.</p>` : ''}
    ${doom ? `<p class="note doom">A mácula transborda. ${P.streak >= 3 ? 'Três erros seguidos.' : `${L.mac} no limite.`}</p>` : ''}
    ${faint ? `<p class="note doom">Você desmaia e acorda mais adiante, com o corpo moído. A vida volta para 35.</p>` : ''}
    ${lessonBox(n.lesson)}
    <button class="btn" id="go">Seguir</button></div>`;
  $('#go').onclick = () => goto(next);
  $('#go').focus({preventScroll:true});
  out.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderChoice(n){
  return `<div class="text">${n.text || ''}</div><p class="ask">O que você faz?</p>
    <div class="opts">${n.opts.map((o, i) => `<button class="opt plain" data-i="${i}"><span class="k">${String.fromCharCode(65 + i)}</span><span class="t">${esc(o.t)}</span></button>`).join('')}</div>`;
}
wiring.choice = n => {
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const o = n.opts[+b.dataset.i];
    app.querySelectorAll('.opt').forEach(x => x.disabled = true); b.classList.add('pick');
    fx(o.fx); const faint = faintCheck();
    P.node = o.go; persist();
    app.querySelector('.hud').outerHTML = hud(); wireHud();
    $('#out').innerHTML = `<div class="out"><p class="fate neutral"><b>VOCÊ ESCOLHEU</b>${esc(o.res || '')}</p>
      ${faint ? `<p class="note doom">Você desmaia e acorda mais adiante, com o corpo moído. A vida volta para 35.</p>` : ''}
      <button class="btn" id="go">Seguir</button></div>`;
    $('#go').onclick = () => goto(o.go);
  });
};

// Montar palavras / ordenar
let buildState = null;
function renderBuild(n){
  buildState = {pool: shuffle(n.pool.map((t, i) => ({t, i}))), picked: []};
  return `<div class="text">${n.text || ''}</div>${listenBlock(n)}<p class="ask">${esc(n.ask)}</p>
    <div class="slots" id="slots"></div><div class="pool" id="pool"></div>
    <div class="row"><button class="ghost" id="undo">Desfazer</button></div>`;
}
function drawBuild(n){
  const c = W().cls;
  $('#slots').innerHTML = n.target.map((_, i) => { const p = buildState.picked[i]; return `<span class="slot ${c}${p ? ' f' : ''}">${p ? esc(p.t) : ''}</span>`; }).join('');
  $('#pool').innerHTML = buildState.pool.map(p => `<button class="tile ${c}" data-i="${p.i}" ${buildState.picked.includes(p) ? 'disabled' : ''}>${esc(p.t)}</button>`).join('');
  app.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const p = buildState.pool.find(x => x.i === +b.dataset.i);
    buildState.picked.push(p); drawBuild(n);
    if (buildState.picked.length === n.target.length) {
      const ok = buildState.picked.every((x, i) => x.t === n.target[i]);
      app.querySelectorAll('.slot').forEach((s, i) => s.classList.add(buildState.picked[i].t === n.target[i] ? 'okk' : 'bad'));
      app.querySelectorAll('.tile,#undo').forEach(x => x.disabled = true);
      resolve(n, ok, null);
    }
  });
}
wiring.build = n => {
  drawBuild(n);
  $('#undo').onclick = () => { buildState.picked.pop(); drawBuild(n); };
};

// Traçar com autoavaliação
const SELF = [['igual', 'Saiu igual'], ['quase', 'Quase'], ['treinar', 'Preciso treinar']];
function selfButtons(){ return `<div class="selfeval"><span class="label">Como saiu?</span><div class="row">${SELF.map(([k, t]) => `<button class="ghost" data-self="${k}">${t}</button>`).join('')}</div></div>`; }
function renderTrace(n){
  return `<div class="text">${n.text}</div>
    <div class="trace" id="tracebox"><div class="model ${W().cls}">${esc(n.glyph)}</div><canvas id="cv"></canvas></div>
    <div class="row"><button class="ghost" id="clear">Limpar</button>${playBtn(n.glyph, 'Ouvir', true)}</div>${selfButtons()}`;
}
wiring.trace = n => {
  const cv = $('#cv'), box = $('#tracebox'), dpr = window.devicePixelRatio || 1;
  const ctx = cv.getContext && cv.getContext('2d');
  if (!ctx) { wireSelf(n, k => { if (n.key) { learn(n.key, null); P.learned[n.key].s = k; } }); return; }
  const size = () => { const r = box.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; const x = ctx; x.scale(dpr, dpr); x.lineCap = 'round'; x.lineJoin = 'round'; x.lineWidth = Math.max(6, r.width / 32); x.strokeStyle = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#c98a5c'; };
  size();
  let drawing = false;
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { drawing = true; try { cv.setPointerCapture(e.pointerId); } catch(_) {} const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = e => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  $('#clear').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); };
  wireSelf(n, k => { if (n.key) { learn(n.key, null); P.learned[n.key].s = k; } });
};
function wireSelf(n, onRate){
  app.querySelectorAll('[data-self]').forEach(b => b.onclick = () => {
    const k = b.dataset.self;
    app.querySelectorAll('[data-self]').forEach(x => x.disabled = true); b.classList.add('pick'); b.style.borderColor = 'var(--accent)'; b.style.color = 'var(--bone)';
    onRate(k);
    P.voice.push({node:P.node, rate:k});
    P.node = n.next; persist();
    $('#out').innerHTML = `<div class="out">${n.after ? `<p class="fate neutral"><b>${k === 'treinar' ? 'ANOTADO PARA REVISÃO' : 'REGISTRADO'}</b>${esc(n.after)}</p>` : `<p class="note">${k === 'treinar' ? 'Anotado. Isso volta na revisão do capítulo.' : 'Registrado.'}</p>`}<button class="btn" id="go">Seguir</button></div>`;
    app.querySelector('.hud').outerHTML = hud(); wireHud();
    $('#go').onclick = () => goto(n.next);
  });
}

// Fala com autoavaliação
function renderSpeak(n){

  return `<div class="text">${n.text}</div>
    <div class="opts">${n.lines.map(l => `<div class="opt plain" style="justify-content:space-between;flex-wrap:wrap"><span><span class="t ${c}" style="font-size:26px">${esc(l.g)}</span>${SAVE.set.roma ? ` <span class="label" style="text-transform:none;letter-spacing:.04em">${esc(l.r)}</span>` : ''}</span>${playBtn(l.g, 'Ouvir', true)}</div>`).join('')}</div>
    <p class="ask">Ouça cada linha, repita em voz alta e compare.</p>${selfButtons()}`;
}
wiring.speak = n => { wireSelf(n, () => {}); };

// Perguntas de revisão (purificação e história extra)
function makeQs(count){
  const lex = W().lex;
  let keys = Object.keys(P.learned).filter(k => lex[k]);
  if (keys.length < 4) keys = Object.keys(lex).slice(0, 10);
  const weak = keys.filter(k => P.learned[k] && (P.learned[k].w > 0 || P.learned[k].s === 'treinar'));
  let pick = shuffle(weak).slice(0, Math.ceil(count / 2));
  pick = pick.concat(shuffle(keys.filter(k => !pick.includes(k)))).slice(0, count);
  while (pick.length < count) pick.push(keys[Math.floor(Math.random() * keys.length)]);
  return shuffle(pick).map(k => {
    const it = lex[k], same = Object.keys(lex).filter(x => x !== k && lex[x].t === it.t);
    let mode = it.t === 'm' ? 'mean' : (Math.random() < .5 ? 'sound' : 'hear');
    const field = mode === 'mean' ? 'm' : mode === 'sound' ? 'r' : 'g';
    const seen = new Set([it[field]]); const wrong = [];
    for (const x of shuffle(same)) { const v = lex[x][field]; if (!seen.has(v)) { seen.add(v); wrong.push(v); } if (wrong.length === 2) break; }
    const opts = shuffle([{t:it[field], ok:true}, ...wrong.map(t => ({t}))]);
    return {k, mode, it, opts,
      ask: mode === 'mean' ? 'O que significa?' : mode === 'sound' ? 'Que som tem?' : 'Ouça. Qual é?',
      plain: mode !== 'hear'};
  });
}
function qHTML(q){
  const c = W().cls;
  const top = q.mode === 'hear'
    ? `<div class="listen">${playBtn(q.it.say || q.it.g, 'Ouvir')}<button class="reveal" data-reveal="${esc(q.it.r)}">Não consigo ouvir</button></div>`
    : `<div class="voice"><span class="line ${c}">${esc(q.it.g)}</span>${q.mode === 'mean' && SAVE.set.roma ? `<span class="ro">${esc(q.it.r)}</span>` : ''}</div>`;
  return `${top}<p class="ask">${q.ask}</p><div class="opts">${q.opts.map((o, i) => `<button class="opt${q.plain ? ' plain' : ''}" data-i="${i}"><span class="k">${String.fromCharCode(65 + i)}</span><span class="t ${q.plain ? '' : c}">${esc(o.t)}</span></button>`).join('')}</div>`;
}
function runQs(container, qs, onAnswer, onDone){
  let i = 0;
  const step = () => {
    if (i >= qs.length) return onDone();
    const q = qs[i];
    container.innerHTML = `<span class="label">Pergunta ${i + 1} de ${qs.length}</span>` + qHTML(q);
    wirePlay(container); wireReveal(container);
    if (q.mode === 'hear') setTimeout(() => say(q.it.say || q.it.g), 300);
    container.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const o = q.opts[+b.dataset.i];
      container.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.i].ok) x.classList.add('right'); });
      if (!o.ok) b.classList.add('wrong');
      learn(q.k, !!o.ok); onAnswer(!!o.ok, q);
      const nx = document.createElement('div');
      nx.innerHTML = `<p class="note" style="margin-top:10px"><span class="${W().cls}" style="font-size:20px;color:var(--bone)">${esc(q.it.g)}</span> · ${esc(q.it.r)}${q.it.m ? ' · ' + esc(q.it.m) : ''}</p><button class="btn" style="margin-top:10px">${i + 1 < qs.length ? 'Próxima' : 'Concluir'}</button>`;
      container.appendChild(nx);
      nx.querySelector('button').onclick = () => { i++; step(); };
      nx.querySelector('button').focus({preventScroll:true});
    });
  };
  step();
}

function renderPurify(n){
  return `<div class="text">${n.text}</div><div class="track" id="track"></div><div id="qbox" style="display:grid;gap:14px"></div>`;
}
wiring.purify = n => {
  const qs = makeQs(n.n); let reduced = 0, right = 0;
  const track = () => { $('#track').innerHTML = Array.from({length:n.max}, (_, i) => `<i class="${i < reduced ? 'win' : ''}" title="mácula lavada"></i>`).join('') + `<span class="label" style="align-self:center;margin-left:6px">mácula lavada: ${reduced} de ${n.max}</span>`; };
  track();
  runQs($('#qbox'), qs, ok => {
    if (ok) { right++; if (reduced < n.max && P.mac > 0) { P.mac--; reduced++; } P.streak = 0; }
    persist(); app.querySelector('.hud').outerHTML = hud(); wireHud(); track();
  }, () => {
    P.node = n.next; persist();
    $('#qbox').innerHTML = `<div class="out"><p class="fate good"><b>PURIFICAÇÃO CONCLUÍDA</b>${right} de ${qs.length} acertos. ${reduced ? `A água levou ${reduced} de mácula.` : (P.mac === 0 ? 'Não havia mácula para lavar.' : 'A mácula continua com você.')}</p><button class="btn" id="go">Seguir</button></div>`;
    $('#go').onclick = () => goto(n.next);
  });
};

// ---------- Finais ----------
function renderBad(n){
  const L = W();
  if (!P.endings.includes('bad')) P.endings.push('bad');
  persist();
  app.innerHTML = hud() + `<article class="scene err">${head({title:n.title, err:true})}<div class="text">${n.text}</div>
    <p class="note doom">Este é um final ruim, mas não é o fim da jornada. Você pode voltar ao último ponto de purificação. O mundo vai lembrar do que aconteceu.</p>
    <div class="row"><button class="btn" id="back">Voltar ao último ponto seguro</button><button class="ghost" data-act="menu">Menu</button></div></article>`;
  wireHud();
  $('#back').onclick = () => {
    const keep = {endings:P.endings.slice(), cp:P.cp, falls:(P.flags.falls || 0) + 1};
    const base = P.cp ? JSON.parse(JSON.stringify(P.cp)) : newProfile(cur);
    base.endings = keep.endings; base.cp = keep.cp; base.flags = Object.assign({}, base.flags, {yomi:true, falls:keep.falls});
    base.hp = Math.max(base.hp, 60); base.streak = 0; base.mac = Math.min(base.mac, 2);
    SAVE.p[cur] = P = base; persist(); render(); window.scrollTo({top:0});
  };
}
function tierOf(){ return P.mac <= 1 ? 0 : P.mac <= 3 ? 1 : 2; }
function renderEnd(){
  const L = W(), t = tierOf();
  if (!P.done.includes(1)) { P.done.push(1); P.ending1 = t; }
  const end = 'c1-' + t; if (!P.endings.includes(end)) P.endings.push(end);
  persist();
  const learned = Object.keys(P.learned).length;
  const rv = P.review;
  app.innerHTML = hud() + `<article class="scene">
    <div class="head"><span class="label">Fim do Capítulo I · ${esc(L.ch1)}</span><h2>${esc(L.tiers[t][0])}</h2></div>
    <div class="text"><p>${esc(L.tiers[t][1])}</p></div>
    <div class="stats">
      <div class="stat"><span class="label">Vida</span><b>${P.hp}</b></div>
      <div class="stat"><span class="label">Mácula</span><b>${P.mac}/${MAX_MAC}</b></div>
      <div class="stat"><span class="label">Fluência</span><b>${P.flu}%</b></div>
      <div class="stat"><span class="label">Grimório</span><b>${learned}</b></div>
    </div>
    ${P.allies.length ? `<p><span class="label">Aliados que lembram de você</span><br>${P.allies.map(a => esc(L.allies[a])).join(' · ')}</p>` : ''}
    <div class="locked" style="border-color:var(--accent);color:var(--fg)"><span class="label">História extra · revisão</span><h3>${esc(L.review.name)}</h3>
      <p style="font-size:15px">${rv ? `Última vez: ${rv.score} de 10 ${esc(L.review.unit)}. Você pode jogar de novo quando quiser.` : 'Revise tudo o que aprendeu no capítulo. O resultado muda o começo do Capítulo II.'}</p>
      <button class="btn" id="rev">${rv ? 'Jogar de novo' : 'Começar'}</button></div>
    <div class="locked"><span class="label">Próximo</span><h3>Capítulo II · em breve</h3><p style="font-size:15px">${esc(L.next)}</p><p style="font-size:14px">Seu progresso, aliados, itens, mácula e grimório ficam salvos e passam para o próximo capítulo.</p></div>
    <div class="row"><button class="ghost" data-act="menu">Menu</button><button class="ghost" data-act="grim">Grimório</button></div>
  </article>`;
  wireHud();
  $('#rev').onclick = () => renderReview();
}
function renderReview(){
  const L = W(), R = L.review, qs = makeQs(10);
  let score = 0; const wrong = [];
  app.innerHTML = hud() + `<article class="scene">
    <div class="head"><span class="label">História extra · Capítulo I</span><h2>${esc(R.name)}</h2></div>
    <div class="text"><p>${esc(R.intro)}</p></div>
    <div class="track" id="track"></div><div id="qbox" style="display:grid;gap:14px"></div></article>`;
  wireHud();
  const jp = cur === 'jp';
  const track = (done) => {
    const misses = done - score;
    $('#track').innerHTML = qs.map((_, i) => `<i class="${jp ? (i < score ? 'lit out' : 'lit') : (i < score ? 'win' : i < score + misses ? 'lose' : '')}"></i>`).join('')
      + `<span class="label" style="align-self:center;margin-left:6px">${jp ? `velas apagadas: ${score} de 10` : `apostas ganhas: ${score} de 10`}</span>`;
  };
  let answered = 0; track(0);
  runQs($('#qbox'), qs, (ok, q) => { answered++; if (ok) score++; else wrong.push(q.k); track(answered); }, () => {
    const win = score >= 8;
    P.review = {score, at:Date.now()};
    P.weak = Array.from(new Set(wrong));
    if (win) fx({item:R.reward});
    persist();
    $('#qbox').innerHTML = `<div class="out"><p class="fate ${win ? 'good' : 'bad'}"><b>${score} DE 10 ${esc(R.unit.toUpperCase())}</b>${esc(win ? R.win : R.lose)}</p>
      ${!win && P.weak.length ? `<p class="note">Para o Capítulo II: ${P.weak.map(k => `<span class="${L.cls}">${esc(L.lex[k].g)}</span>`).join(' · ')}</p>` : ''}
      <button class="btn" id="go">Voltar ao fim do capítulo</button></div>`;
    app.querySelector('.hud').outerHTML = hud(); wireHud();
    $('#go').onclick = () => { render(); window.scrollTo({top:0}); };
  });
}

// ---------- Grimório ----------
function grimoire(){
  const L = W();
  const keys = Object.keys(P.learned).filter(k => L.lex[k]);
  const order = Object.keys(L.lex);
  keys.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  const selfTxt = {igual:'traço: igual', quase:'traço: quase', treinar:'traço: treinar'};
  drawer.innerHTML = `<div class="panel" role="dialog" aria-label="Grimório">
    <div class="ph"><h2>Grimório</h2><button class="ghost" id="close">Fechar</button></div>
    <p class="label">${keys.length} ${keys.length === 1 ? 'entrada' : 'entradas'} · toque para ouvir</p>
    ${keys.length ? `<div class="glist">${keys.map(k => { const it = L.lex[k], e = P.learned[k]; return `<button class="gitem" data-say="${esc(it.say || it.g)}"><span class="g ${L.cls}">${esc(it.g)}</span><span class="r">${esc(it.r)}</span>${it.m ? `<span class="m">${esc(it.m)}</span>` : ''}<span class="sc">✓ ${e.r} · ✗ ${e.w}${e.s ? ' · ' + selfTxt[e.s] : ''}</span></button>`; }).join('')}</div>` : `<p class="empty">Vazio. Cada letra e palavra que você encontrar fica escrita aqui.</p>`}
  </div>`;
  drawer.hidden = false; wirePlay(drawer);
  $('#close').onclick = closeDrawer; $('#close').focus();
}
function closeDrawer(){ drawer.hidden = true; drawer.innerHTML = ''; }
drawer.addEventListener('click', e => { if (e.target === drawer) closeDrawer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

// ---------- Ajustes e backup do progresso ----------
function encodeSave(){ return btoa(unescape(encodeURIComponent(JSON.stringify(SAVE)))); }
function decodeSave(s){ const o = JSON.parse(decodeURIComponent(escape(atob(s.trim())))); if (!o || o.v !== SAVE_V || !o.p) throw new Error('formato'); return o; }
function settings(){
  drawer.innerHTML = `<div class="panel" role="dialog" aria-label="Ajustes">
    <div class="ph"><h2>Ajustes</h2><button class="ghost" id="close">Fechar</button></div>
    <div class="set"><label class="toggle"><input type="checkbox" id="roma" ${SAVE.set.roma ? 'checked' : ''}> Mostrar romanização nas falas e no grimório</label></div>
    <div class="set"><label class="label" for="rate">Velocidade da voz</label>
      <select id="rate"><option value="0.6">Lenta</option><option value="0.85">Normal</option><option value="1">Rápida</option></select>
      <p style="font-size:14px;color:var(--muted)">A voz usa o sintetizador do aparelho. Se uma língua não falar, instale a voz de japonês ou coreano nas configurações de texto para fala do celular. O botão "Não consigo ouvir" mostra o som escrito.</p></div>
    <div class="set"><span class="label">Vozes do aparelho</span>
      <div class="row"><span id="vjp" style="font-size:15px">Japonês: verificando…</span><button class="ghost" data-test="ja-JP">Testar</button></div>
      <div class="row"><span id="vkr" style="font-size:15px">Coreano: verificando…</span><button class="ghost" data-test="ko-KR">Testar</button></div>
      ${IS_NATIVE && NTTS ? `<div class="row"><button class="ghost" id="install">Abrir instalação de vozes</button></div>` : ''}</div>
    <div class="set"><span class="label">Copiar progresso</span>
      <p style="font-size:14px;color:var(--muted)">O progresso fica salvo neste aparelho. Guarde este código para levar o jogo para outro aparelho ou para o app instalado.</p>
      <textarea id="exp" readonly>${encodeSave()}</textarea>
      <div class="row"><button class="ghost" id="copy">Copiar código</button></div></div>
    <div class="set"><label class="label" for="imp">Restaurar progresso</label>
      <textarea id="imp" placeholder="Cole aqui um código de progresso"></textarea>
      <div class="row"><button class="ghost" id="load">Restaurar</button></div></div>
    <p class="msg" id="msg"></p>
  </div>`;
  drawer.hidden = false;
  $('#rate').value = String(SAVE.set.rate);
  const SAMPLE = {'ja-JP':'こんにちは', 'ko-KR':'안녕하세요'};
  const checkVoices = async () => {
    for (const [id, lang, name] of [['#vjp', 'ja-JP', 'Japonês'], ['#vkr', 'ko-KR', 'Coreano']]) {
      const ok = await hasVoice(lang); const el = $(id);
      if (el) el.innerHTML = `${name}: ${ok ? '<span style="color:var(--ok)">instalada</span>' : '<span style="color:var(--err)">não encontrada</span>'}`;
    }
  };
  checkVoices(); setTimeout(checkVoices, 1200);
  drawer.querySelectorAll('[data-test]').forEach(b => b.onclick = () => sayIn(SAMPLE[b.dataset.test], b.dataset.test));
  if ($('#install')) $('#install').onclick = async () => {
    const msg = $('#msg');
    const Voz = (CAP.Plugins && CAP.Plugins.Voz) || (CAP.registerPlugin && CAP.registerPlugin('Voz'));
    try {
      await Voz.abrirConfiguracoes();
      msg.textContent = 'Na tela que abriu, escolha os Serviços de Voz do Google, toque na engrenagem e em Instalar dados de voz. Baixe japonês e coreano, volte ao app e toque em Testar.';
    } catch(e) {
      msg.textContent = 'Não consegui abrir a tela de voz. Abra as Configurações do celular e pesquise por "texto para fala".';
    }
  };
  $('#close').onclick = () => { closeDrawer(); title(); };
  $('#roma').onchange = e => { SAVE.set.roma = e.target.checked; persist(); };
  $('#rate').onchange = e => { SAVE.set.rate = parseFloat(e.target.value); persist(); };
  $('#copy').onclick = () => {
    const t = $('#exp');
    try { navigator.clipboard.writeText(t.value).then(() => $('#msg').textContent = 'Código copiado.', () => { t.select(); $('#msg').textContent = 'Selecionei o código: copie com o menu do aparelho.'; }); }
    catch(e) { t.select(); $('#msg').textContent = 'Selecionei o código: copie com o menu do aparelho.'; }
  };
  $('#load').onclick = () => {
    try { SAVE = decodeSave($('#imp').value); persist(); $('#msg').textContent = 'Progresso restaurado.'; }
    catch(e) { $('#msg').textContent = 'Código inválido. Confira se colou o código inteiro, sem cortes.'; }
  };
  $('#close').focus();
}

// ---------- Tela de título ----------
function title(){
  closeDrawer(); cur = null; P = null; delete document.body.dataset.lang;
  try { if (NTTS) NTTS.stop().catch(() => {}); else speechSynthesis.cancel(); } catch(e) {}
  const card = lang => {
    const L = STORY[lang], p = SAVE.p[lang];
    const st = p ? ((L.nodes[p.node] || {}).st || (p.node === 'END' ? 12 : 1)) : 0;
    const meta = p ? `<div class="meta"><span>${p.done.includes(1) ? 'Capítulo I concluído' : `Capítulo I · etapa ${st}/12`}</span><span>Fluência ${p.flu}%</span><span>Mácula ${p.mac}/${MAX_MAC}</span><span>Grimório ${Object.keys(p.learned).length}</span></div>` : '';
    return `<section class="world ${lang}">
      <span class="gl ${L.cls}" aria-hidden="true">${L.glyph}</span>
      <span class="label">${L.lang} · do zero à fluência</span>
      <h2>${esc(L.name)}</h2><p>${esc(L.pitch)}</p>${meta}
      <div class="row">${p ? `<button class="btn" data-open="${lang}">Continuar</button><button class="ghost" data-reset="${lang}">Recomeçar</button>` : `<button class="btn" data-open="${lang}">Começar</button>`}</div>
      <div data-confirm="${lang}"></div></section>`;
  };
  app.innerHTML = `<div class="title">
    <div class="brand">
      <div class="mark"><span class="k1">鏡</span><span class="dot">·</span><span class="k2">거울</span></div>
      <h1>Kagami Geoul</h1>
      <p>Dois espelhos, dois mundos dos mortos. Em cada um, aprender a língua é a única forma de voltar.</p>
    </div>
    <div class="worlds">${card('jp')}${card('kr')}</div>
    <div class="row"><button class="ghost" id="set">Ajustes e backup</button></div>
    <p class="foot">Piloto offline. Cada erro abre uma rota alternativa e aumenta a mácula; três acertos seguidos a fazem recuar. Muitos erros seguidos levam a um final ruim, mas sempre é possível voltar ao último ponto de purificação. O progresso é salvo automaticamente neste aparelho.</p>
  </div>`;
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => open(b.dataset.open, false));
  app.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const lang = b.dataset.reset, box = app.querySelector(`[data-confirm="${lang}"]`);
    box.innerHTML = `<div class="confirm"><p>Recomeçar apaga o progresso de ${esc(STORY[lang].name)}: grimório, aliados e itens. O outro idioma não é afetado.</p>
      <div class="row"><button class="btn" style="background:var(--err)" data-yes>Apagar e recomeçar</button><button class="ghost" data-no>Cancelar</button></div></div>`;
    box.querySelector('[data-yes]').onclick = () => open(lang, true);
    box.querySelector('[data-no]').onclick = () => { box.innerHTML = ''; };
  });
  $('#set').onclick = settings;
  window.scrollTo({top:0});
}

// Botão "voltar" do Android: fecha gaveta, volta ao menu, ou sai do app.
if (IS_NATIVE) {
  const AppP = (CAP.Plugins && CAP.Plugins.App) || (CAP.registerPlugin && CAP.registerPlugin('App'));
  try {
    AppP && AppP.addListener('backButton', () => {
      if (!drawer.hidden) closeDrawer();
      else if (cur) title();
      else AppP.exitApp();
    });
  } catch(e) {}
}

title();

</script>
